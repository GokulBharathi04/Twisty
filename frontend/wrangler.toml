# Cloudflare Pages project for the Twisty Wrap Enterprises website.
# Static site = build/ (CRA output); /api/* = Pages Functions in functions/.
# Setup steps and DNS notes: see DEPLOY-CLOUDFLARE.md at the repo root.
name = "twisty-wraps"
pages_build_output_dir = "./build"
compatibility_date = "2025-09-01"

[vars]
ENQUIRY_NOTIFY_EMAIL = "admin@twistywrapenterprises.com"
EMAIL_FROM = "Twisty Wrap Enterprises <enquiries@twistywrapenterprises.com>"
EMAIL_FROM_NAME = "Twisty Wrap Enterprises"
# Secret, set in the dashboard or with `npx wrangler pages secret put RESEND_API_KEY` (never here):
#   RESEND_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "twisty-enquiries"
# Replace with the id printed by `npx wrangler d1 create twisty-enquiries` before the first deploy.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "twisty-enquiry-attachments"
